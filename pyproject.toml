[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-vision-playground"
version = "0.1.0"
description = "Benchmark-friendly computer vision lab for CNN classification, U-Net segmentation, visualization, and automated experiment reporting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Austin Tabb" }
]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "torchaudio>=2.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pillow>=10.2",
  "opencv-python>=4.9",
  "scikit-learn>=1.4",
  "albumentations>=1.4",
  "pyyaml>=6.0.1",
  "tqdm>=4.66",
  "rich>=13.7",
  "typer>=0.12",
  "tensorboard>=2.16"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "black>=24.2",
  "mypy>=1.8",
  "ipykernel>=6.29"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
